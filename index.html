<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f6f2">
<title>Typing Studio | Terminal Velocity</title>
<link rel="stylesheet" href="style.css?v=43732649c">
<script defer src="words.js?v=2e41e3790"></script>
<script defer src="script.js?v=91610c044"></script>
</head>
<body>
<header class="top"><div class="wrap nav"><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Terminal Velocity</div><span class="nav-label">Typing workspace</span><button id="sound" aria-pressed="false"><span aria-hidden="true">♪</span> Sound off</button></div></header>
<main class="wrap">
<section class="hero"><canvas id="wave" aria-hidden="true"></canvas><div class="hero-copy"><div class="eyebrow"><i class="dash"></i> KEYSTROKE LAB</div><h1>Typing studio<span>.</span></h1><p>Build speed and precision, one keystroke at a time.</p></div></section>
<div class="workspace">
<section class="panel practice"><div class="panel-heading"><h2><span class="terminal icon" aria-hidden="true">›_</span> Practice console</h2><span id="status" role="status">Ready</span></div>
<div class="settings">
<div><label for="hand">Hand mode</label><select id="hand"><option value="both">Both hands</option><option value="left">Left hand</option><option value="right">Right hand</option></select></div>
<div><label for="mode">Challenge</label><select id="mode"><option value="words">Words</option><option value="time">Time</option></select></div>
<div><label id="length-label" for="length">Word count</label><select id="length"></select></div>
</div>
<div class="passage" id="passage"><div id="display" aria-hidden="true"></div><input id="entry" aria-label="Type the practice passage" aria-describedby="accessible-passage" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><span id="accessible-passage" class="sr"></span></div>
<div id="results" hidden><h3>Session complete<span>.</span></h3><p id="summary"></p></div>
<div class="practice-foot"><span id="hint">Start typing to begin</span><button id="restart"><span aria-hidden="true">↻</span> Restart</button></div>
</section>
<aside class="panel metrics"><div class="panel-heading"><h2><span class="icon bars" aria-hidden="true"><i></i><i></i><i></i></span> Live metrics</h2></div>
<div class="metric"><div><label>Typing speed</label><strong id="wpm">0</strong><small>WPM</small></div><canvas id="spark" width="105" height="34" aria-hidden="true"></canvas></div>
<div class="metric"><div><label>Accuracy</label><strong id="accuracy">100</strong><small>%</small></div><div class="accuracy-track"><i id="accuracy-bar"></i></div></div>
<div class="metric"><div><label id="timer-label">Elapsed time</label><strong id="timer">0:00</strong></div><span class="clock" aria-hidden="true"></span></div></aside>
<section class="panel guide"><div class="panel-heading"><h2><span class="icon keyboard-icon" aria-hidden="true">⌨</span> Keyboard guide</h2><div class="legend"><span><i></i> Left hand</span><span><i></i> Right hand</span></div></div><div id="keyboard" aria-hidden="true"></div></section>
</div></main></body></html>
